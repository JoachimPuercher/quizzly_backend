services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - db_data:/app/data
      - transcribed_data:/app/transcribed_data
      - whisper_cache:/root/.cache/whisper
    restart: unless-stopped

volumes:
  db_data:
  transcribed_data:
  whisper_cache:
